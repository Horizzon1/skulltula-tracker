<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1520"><style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><meta name="robots" content="noindex, nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Skulltulas"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"></head><body><title>Skulltula Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a pause-menu look. Night-sky backdrop, gold-framed stone panels, medallion-colored areas.
   Header holds a token ring with the overall count; areas sit in a 2-up grid; fixed tab bar at the bottom.
   Single dark theme by choice. */
:root {
  --night: #0a1520;
  --night-2: #10202e;
  --panel: #142636;
  --panel-2: #1b3246;
  --edge: rgba(212, 175, 96, 0.38);
  --edge-soft: rgba(212, 175, 96, 0.16);
  --ink: #f1e9d2;
  --dim: #9fb0b8;
  --gold: #e8bf55;
  --gold-hi: #ffe39a;
  --gold-deep: #9c7a2b;
  --forest: #74d08a;
  --fire: #f07c55;
  --water: #62b6f2;
  --shadow: #b593f2;
  --spirit: #f3a64b;
  --light: #f2d47c;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
h1, h2 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
:focus:not(:focus-visible) { outline: none; }

/* Night sky behind everything */
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 72% 9%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.5px 1.5px at 38% 34%, rgba(255,240,200,.6), transparent 60%),
    radial-gradient(1px 1px at 88% 41%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 22% 63%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 61% 72%, rgba(255,240,200,.45), transparent 60%),
    radial-gradient(1px 1px at 8% 88%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 93% 83%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(120% 60% at 50% -10%, #1d3a52 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 110%, #0f2a2a 0%, transparent 70%),
    var(--night);
}

.wrap { max-width: 640px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* Gold-framed panel with corner brackets */
.panel { position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--edge); border-radius: 6px; box-shadow: inset 0 0 0 3px rgba(6, 14, 22, 0.55), 0 6px 18px rgba(0, 0, 0, 0.35); }
.panel::before { content: ""; position: absolute; inset: 4px; border: 1.5px solid var(--gold); border-radius: 3px; pointer-events: none; opacity: .75;
  -webkit-mask: linear-gradient(#000 0 0) top left / 10px 10px no-repeat, linear-gradient(#000 0 0) top right / 10px 10px no-repeat, linear-gradient(#000 0 0) bottom left / 10px 10px no-repeat, linear-gradient(#000 0 0) bottom right / 10px 10px no-repeat;
          mask: linear-gradient(#000 0 0) top left / 10px 10px no-repeat, linear-gradient(#000 0 0) top right / 10px 10px no-repeat, linear-gradient(#000 0 0) bottom left / 10px 10px no-repeat, linear-gradient(#000 0 0) bottom right / 10px 10px no-repeat; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(180deg, rgba(10, 21, 32, 0.97), rgba(10, 21, 32, 0.9)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--edge-soft); }
.top .wrap { padding-block: 12px; display: flex; align-items: center; gap: 14px; }
.back { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: -8px; border-radius: 50%; color: var(--gold); flex: none; transition: background-color .15s ease; }
.back:hover { background: var(--edge-soft); }
.ring { position: relative; width: 62px; height: 62px; flex: none; color: var(--gold); }
.ring svg.track { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .emblem { position: absolute; inset: 13px; filter: drop-shadow(0 0 6px rgba(232, 191, 85, 0.45)); }
.head-text { min-width: 0; flex: 1; display: grid; gap: 2px; }
.title { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; letter-spacing: 0.03em; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top.in-area .title { white-space: normal; font-size: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sub { font-size: 14px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub strong { color: var(--gold-hi); font-weight: 700; }
.score { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--gold); letter-spacing: .02em; }
.score span { color: var(--dim); font-weight: 500; }

main .wrap { padding-block: 20px calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 26px; }

/* Ornamental section heading */
.orn { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--edge)); }
.orn::after { background: linear-gradient(90deg, var(--edge), transparent); }
.orn .gem { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: none; }
.orn small { font-family: var(--font-body); letter-spacing: .04em; font-size: 14px; color: var(--dim); text-transform: none; font-weight: 500; }
.section { display: grid; gap: 14px; }

/* Area cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.area { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 16px 10px 14px; min-width: 0; transition: transform .15s ease, border-color .15s ease; }
.area:hover { border-color: rgba(232, 191, 85, 0.7); transform: translateY(-1px); }
.medal { position: relative; width: 64px; height: 64px; color: var(--el); }
.medal svg.track { position: absolute; inset: 0; transform: rotate(-90deg); }
.medal .core { position: absolute; inset: 9px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--el) 30%, transparent), rgba(6, 14, 22, 0.8) 70%); border: 1px solid color-mix(in srgb, var(--el) 45%, transparent); }
.area.done .medal .core { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--el) 85%, white), var(--el) 55%, color-mix(in srgb, var(--el) 50%, black)); color: #0b1620; box-shadow: 0 0 16px color-mix(in srgb, var(--el) 60%, transparent); }
.area-name { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; line-height: 1.25; letter-spacing: .02em; min-height: 2.5em; display: flex; align-items: center; }
.area-count { font-size: 14px; color: var(--dim); }
.area-count b { color: var(--ink); font-weight: 700; }
.area.done .area-count b { color: var(--gold-hi); }

/* Area page controls */
.area-hero { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.area-hero .medal { width: 56px; height: 56px; flex: none; }
.area-hero .medal .core { inset: 8px; }
.area-hero p { color: var(--dim); font-size: 15px; }
.area-hero b { color: var(--ink); font-family: var(--font-display); font-size: 17px; display: block; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--edge); border-radius: 99px; background: rgba(6, 14, 22, 0.5); }
.seg button { padding: 6px 14px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--dim); transition: color .15s ease, background-color .15s ease; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1a1406; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); padding: 6px 2px; }
.toggle:hover { color: var(--ink); }
.toggle .sw { width: 34px; height: 20px; border-radius: 99px; background: rgba(6, 14, 22, 0.6); border: 1px solid var(--edge); position: relative; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); transition: transform .15s ease, background-color .15s ease; }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(14px); background: var(--gold); }

/* Skulltula list */
.list { display: grid; gap: 10px; }
.item-head { display: flex; align-items: stretch; }
.open { flex: 1; min-width: 0; text-align: left; padding: 14px 6px 14px 16px; display: grid; gap: 7px; }
.open:hover .hint { color: var(--gold-hi); }
.hint { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; line-height: 1.3; letter-spacing: .01em; transition: color .15s ease; }
.item.got .hint { color: var(--dim); }
.item.got { border-color: rgba(232, 191, 85, 0.6); background: linear-gradient(180deg, #213a3a, #162a30); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 1px 9px 1px 7px; border-radius: 99px; background: color-mix(in srgb, currentColor 14%, transparent); }
.chip svg { flex: none; }
.chip.child { color: var(--forest); }
.chip.adult { color: var(--water); }
.chip.both { color: var(--light); }
.chip.night { color: var(--shadow); }
.more { font-size: 13px; color: var(--dim); display: inline-flex; align-items: center; gap: 2px; }
.more svg { transition: transform .2s ease; }
.item.is-open .more svg { transform: rotate(180deg); }
.check { flex: none; width: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-left: 1px solid var(--edge-soft); color: #4d6470; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; transition: color .15s ease; }
.check:hover { color: var(--gold); }
.check .tok { width: 34px; height: 34px; }
.check[aria-pressed="true"] { color: var(--gold); }
.check .tok[viewBox="0 0 32 32"] { width: 42px; height: 42px; }
.check:not([aria-pressed="true"]) .tok[viewBox="0 0 32 32"] { filter: grayscale(1) brightness(.85); opacity: .38; }
.tab svg[viewBox="0 0 32 32"] { width: 26px; height: 26px; margin: -2px 0; }
.tab:not([aria-current="page"]) svg[viewBox="0 0 32 32"] { filter: grayscale(1); opacity: .6; }
.ring:not(.heart) .emblem { inset: 10px; }
.check[aria-pressed="true"] .tok { filter: drop-shadow(0 0 7px rgba(232, 191, 85, 0.7)); }
.check.pop .tok { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.6) rotate(-12deg); } 100% { transform: scale(1) rotate(0); } }
.detail { margin: 0 12px 12px; padding: 14px; border-radius: 4px; background: rgba(6, 14, 22, 0.5); border: 1px solid var(--edge-soft); display: grid; gap: 12px; }
.detail h3 { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
.detail p { max-width: 62ch; }
.shot { display: block; width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--edge); aspect-ratio: 16 / 9; max-width: 100%; background: var(--night); }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .2s ease; }
.shot:hover img { transform: scale(1.02); }
.lightbox { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gutter-r) max(16px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); background: rgba(4, 9, 14, 0.92); }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; border: 1px solid var(--edge); }
.lb-frame { position: relative; display: inline-block; line-height: 0; max-width: 100%; max-height: 100%; }
.lb-frame img { max-height: calc(100vh - 32px); }
.media { display: grid; gap: 8px; justify-items: start; }
.media .seg button { padding: 4px 14px; font-size: 13px; }
.map { position: relative; display: block; width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--edge); background: #0d1f2e; line-height: 0; }
.map img { display: block; width: 100%; height: auto; }
.floor { position: absolute; top: 8px; left: 8px; line-height: 1.2; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 99px; color: var(--gold-hi); background: rgba(6, 14, 22, 0.82); border: 1px solid var(--edge); }
.pin { position: absolute; width: 0; height: 0; pointer-events: none; }
.pin::before, .pin::after { content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; }
.pin::before { background: var(--gold); border: 3px solid #1a1406; box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px rgba(255, 227, 154, 0.9); }
.pin::after { border: 2px solid var(--gold-hi); animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
.lb-frame .pin::before, .lb-frame .pin::after { left: -11px; top: -11px; width: 22px; height: 22px; }
.needs { display: flex; flex-wrap: wrap; gap: 6px; }
.need { font-size: 14px; padding: 2px 10px; border-radius: 4px; border: 1px solid var(--edge); color: var(--gold-hi); background: rgba(232, 191, 85, 0.07); }
.empty { padding: 28px 16px; text-align: center; color: var(--dim); }

/* Rewards path */
.path { position: relative; display: grid; gap: 14px; padding-left: 0; }
.path::before { content: ""; position: absolute; left: 27px; top: 28px; bottom: 28px; width: 2px; background: var(--edge-soft); }
.path .fill { position: absolute; left: 27px; top: 28px; width: 2px; background: linear-gradient(var(--gold-hi), var(--gold)); box-shadow: 0 0 8px rgba(232, 191, 85, .6); }
.step { position: relative; display: flex; align-items: center; gap: 14px; }
.node { position: relative; z-index: 1; flex: none; width: 56px; height: 56px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--night-2); border: 2px solid var(--edge); color: var(--dim); }
.node b { font-family: var(--font-display); font-size: 18px; line-height: 1; color: var(--ink); }
.node small { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.step.ready .node { border-color: var(--gold); box-shadow: 0 0 14px rgba(232, 191, 85, .5); }
.step.ready .node b { color: var(--gold-hi); }
.step.claimed .node { background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 55%, var(--gold-deep)); border-color: var(--gold-hi); color: #3a2c08; }
.step.claimed .node b { color: #2a1f04; }
.step .panel { flex: 1; min-width: 0; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.r-info { flex: 1; min-width: 0; display: grid; gap: 1px; }
.r-name { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; }
.r-desc { font-size: 14px; color: var(--dim); }
.r-state { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.step.locked .r-state { color: var(--dim); }
.step.ready .r-state { color: var(--gold-hi); }
.step.claimed .r-state { color: var(--forest); }
.btn { flex: none; padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 700; border: 1px solid var(--edge); color: var(--gold-hi); background: rgba(232, 191, 85, 0.08); transition: background-color .15s ease, border-color .15s ease; }
.btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(232, 191, 85, 0.16); }
.btn:disabled { opacity: .35; }
.btn[aria-pressed="true"] { color: var(--dim); background: transparent; border-color: var(--edge-soft); }
.note { font-size: 15px; color: var(--dim); max-width: 62ch; }
.note-panel { padding: 14px 16px; display: grid; gap: 4px; }
.note-panel.backup { gap: 8px; margin-top: 20px; }
.note-panel h3 { font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.reset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn.danger { color: #f0a090; border-color: rgba(240, 120, 100, .4); background: rgba(240, 120, 100, .06); }
.btn.danger:hover { border-color: #f08070; background: rgba(240, 120, 100, .14); }
.sync { font-size: 13px; color: var(--dim); text-align: center; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(180deg, rgba(16, 32, 46, 0.95), rgba(8, 16, 24, 0.98)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--edge); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-block: 6px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 7px 0 6px; border-radius: 6px; font-family: var(--font-display); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); transition: color .15s ease, background-color .15s ease; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--gold-hi); background: rgba(232, 191, 85, 0.1); box-shadow: inset 0 0 0 1px var(--edge); }


/* Inventory and locked state */
.score #leftNow { color: var(--forest); font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
.avail { font-size: 12.5px; font-weight: 700; color: var(--forest); padding: 1px 9px; border-radius: 99px; background: rgba(116, 208, 138, 0.12); display: inline-flex; align-items: center; gap: 4px; }
.avail.none { color: var(--dim); background: rgba(159, 176, 184, 0.1); }
.area.blocked .medal, .area.blocked .area-name { opacity: .55; filter: grayscale(.7); }
.item.locked { background: linear-gradient(180deg, #172430, #111c26); border-color: rgba(159, 176, 184, 0.25); }
.item.locked .hint, .item.locked .chips { opacity: .5; }
.item.locked .chip { filter: grayscale(1); }
.item.locked .check { opacity: .55; }
.needs-line { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 700; color: #e8a58f; }
.need { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); border-color: rgba(159, 176, 184, 0.3); background: transparent; transition: border-color .15s ease, color .15s ease; }
.need:hover { border-color: var(--gold); color: var(--ink); }
.need.have { color: var(--gold-hi); border-color: var(--edge); background: rgba(232, 191, 85, 0.07); }
.need-tip { font-size: 13px; color: var(--dim); margin-top: 6px; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.items-sum { font-size: 15px; color: var(--dim); text-align: center; }
.items-sum b { color: var(--gold-hi); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.slot { display: grid; justify-items: center; align-content: start; gap: 4px; padding: 12px 6px 10px; border-radius: 8px; text-align: center; background: rgba(6, 14, 22, 0.55); border: 1px solid rgba(159, 176, 184, 0.18); color: #5d7380; transition: border-color .15s ease, background-color .15s ease, color .15s ease; }
.slot:hover:not(:disabled) { border-color: var(--edge); color: var(--dim); }
.slot-art { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(159, 176, 184, 0.15); }
.slot[style*="--note"] .slot-art { color: inherit; }
.slot-name { font-family: var(--font-display); font-weight: 700; font-size: 12.5px; line-height: 1.2; color: var(--dim); }
.slot-note { font-size: 12px; line-height: 1.25; color: #5d7380; }
.slot.on { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border-color: var(--edge); color: var(--gold-hi); }
.slot.on[style*="--note"] { color: var(--note); }
.slot.on .slot-art { border-color: currentColor; background: radial-gradient(circle, color-mix(in srgb, currentColor 22%, transparent), transparent 70%); box-shadow: 0 0 12px color-mix(in srgb, currentColor 35%, transparent); }
.slot.on .slot-name { color: var(--ink); }
.slot.on .slot-note { color: var(--dim); }

:root { --heart: #f0605d; }
.ring.heart { color: var(--heart); }

.check .tok[viewBox="0 0 24 24"] { width: 30px; height: 30px; }

.meter { padding: 14px 16px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.hearts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.hm .hm-bg { color: rgba(240, 96, 93, 0.16); stroke: rgba(240, 96, 93, 0.55); stroke-width: 1.2px; }
.hm .hm-fill { color: var(--heart); }
@media (max-width: 360px) { .tab { font-size: 10.5px; letter-spacing: .02em; } }
@media (max-width: 350px) { .grid { grid-template-columns: minmax(0, 1fr); } .area-name { min-height: 0; } }

// Heart areas reuse the Skulltula area names.
HEART_AREAS.forEach(h => { const a = AREAS.find(x => x.id === h.id); h.name = a.name; h.group = a.group; });

// Two collections share the area pages, counters and item locks.
const COLS = {
  sk: { key: "sk", areas: AREAS, total: 100, unit: "token", units: "tokens", noun: "Skulltula", title: "Skulltula Tracker", icon: "i-token", base: "" },
  hp: { key: "hp", areas: HEART_AREAS, total: 36, unit: "piece", units: "pieces", noun: "Heart Piece", title: "Pieces of Heart", icon: "i-heart", base: "hearts/" },
};
Object.values(COLS).forEach(c => { c.rows = c.areas.flatMap(a => a.list); c.ids = new Set(c.rows.map(s => s[0])); });
const colOf = id => COLS.hp.ids.has(id) ? COLS.hp : COLS.sk;
const ALL = [...COLS.sk.ids, ...COLS.hp.ids];

// ---------- State ----------
const LS_KEY = "sk-tracker-v1";
let state = { got: [], claimed: [], items: [], updatedAt: 0 };
let ui = { age: "all", hideGot: false, hideLocked: false, open: null, view: "photo" };
try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && Array.isArray(s.got)) state = s; } catch (e) {}
try { const u = JSON.parse(localStorage.getItem(LS_KEY + "-ui") || "null"); if (u) { ui.age = u.age || "all"; ui.hideGot = !!u.hideGot; ui.hideLocked = !!u.hideLocked; ui.view = u.view === "map" ? "map" : "photo"; } } catch (e) {}
let got = new Set(state.got.filter(id => ALL.includes(id)));
let claimed = new Set(state.claimed);
let owned = new Set(state.items || []);

// ---------- Sync (account storage when available, device storage always) ----------
let remote = null, writing = false, pending = false, syncLabel = "Saved on this device";
function snapshot() { return { got: [...got], claimed: [...claimed], items: [...owned], updatedAt: Date.now() }; }
function saveLocal(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {} }
let saveTimer = null;
// Phone app only: mirror progress to a backup file the user picked, which survives a reinstall.
const NATIVE = window.SKNative || null;
let backupName = "", backupMsg = "";
try { if (NATIVE) backupName = NATIVE.fileName() || ""; } catch (e) {}
function writeBackup() { if (NATIVE && backupName) try { NATIVE.write(JSON.stringify(state)); } catch (e) {} }
function backupLabel() { return backupName ? `Saved on this device and in ${backupName}` : syncLabel; }
window.skBackupLinked = (name, text) => {
  if (text) {
    let f = null;
    try { f = JSON.parse(text); } catch (e) {}
    if (!f || !Array.isArray(f.got)) {
      try { NATIVE.unlink(); } catch (e) {}
      backupName = ""; backupMsg = `${name} isn't a Skulltula Tracker backup, so nothing changed.`;
      render(); return;
    }
    if ((f.updatedAt || 0) >= (state.updatedAt || 0)) { adopt(f); backupMsg = `Progress restored from ${name}.`; }
    else backupMsg = `Your progress on this phone is newer than ${name}, so the file was updated instead.`;
  } else backupMsg = "";
  backupName = name;
  writeBackup(); render();
};
window.skBackupFailed = () => { backupMsg = `Couldn't write to ${backupName}. Pick the file again.`; backupName = ""; render(); };
function save() {

    if (!id) return;
    remote = db.doc("data/users/" + id + "/progress");

    if (r && (r.updatedAt || 0) >= (state.updatedAt || 0)) { adopt(r); render(); }

function heartMeter() {
  const n = colGot(COLS.hp);
  const hearts = Array.from({ length: 9 }, (_, i) => {
    const q = Math.max(0, Math.min(4, n - i * 4));
    return `<svg class="hm" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
      <clipPath id="hq${i}"><rect x="0" y="0" width="${q >= 2 ? 24 : q >= 1 ? 12 : 0}" height="${q >= 4 ? 24 : 12}"/>${q === 3 ? '<rect x="0" y="12" width="12" height="12"/>' : ""}</clipPath>
      <use href="#i-heart" class="hm-bg"/><use href="#i-heart" class="hm-fill" clip-path="url(#hq${i})"/>
    </svg>`;
  }).join("");
  return `<div class="meter panel" role="img" aria-label="${Math.floor(n / 4)} of 9 extra hearts, ${n % 4} of 4 pieces toward the next">
      <div class="hearts">${hearts}</div>
      <p class="note">Every 4 pieces make one heart container. All 36 add 9 hearts.</p>
    </div>`;
}

function renderHome(col) {
  return (col.key === "hp" ? heartMeter() : "") + ["Overworld", "Dungeons"].map(g => {
    const areas = col.areas.filter(a => a.group === g);
    if (!areas.length) return "";
    const n = areas.reduce((t, a) => t + areaCount(a), 0);
    const of = areas.reduce((t, a) => t + a.list.length, 0);
    const l = areas.reduce((t, a) => t + left(a.list), 0);
    return `<section class="section" aria-labelledby="g-${g}">
      <h2 class="orn" id="g-${g}"><span class="gem"></span>${g}<small>${n}/${of} · ${l} reachable</small><span class="gem"></span></h2>
      <div class="grid">${areas.map(a => {
        const c = areaCount(a), t = a.list.length, l = left(a.list);
        const tag = c === t ? "" : l ? `<span class="avail">${l} reachable</span>` : `<span class="avail none">${ICON_LOCK}Need items</span>`;
        return `<a class="area panel${c === t ? " done" : ""}${c < t && !l ? " blocked" : ""}" href="#${col.base}${a.id}">
          ${medal(a, 64)}
          <span class="area-name">${esc(a.name)}</span>
          <span class="area-count"><b>${c}</b> of ${t}</span>
          ${tag}
        </a>`;
      }).join("")}</div>
    </section>`;
  }).join("") + backupCard(false) + `<p class="sync" id="sync">${esc(backupLabel())}</p>`;
}
function backupCard(always) {
  if (!NATIVE || (backupName && !always)) return "";
  const msg = backupMsg ? `<p class="note" role="status">${esc(backupMsg)}</p>` : "";
  if (backupName) return `${msg}<div class="reset-row"><button type="button" class="btn" id="bkOpen">Restore from a file</button><button type="button" class="btn" id="bkCreate">Use a new file</button></div>`;
  return `<div class="note-panel panel backup">
      <h3>Keep progress after a reinstall</h3>
      <p class="note">Uninstalling the app erases its storage. Pick a backup file in Downloads or Drive and every change is copied there. After a reinstall, tap Restore and choose the same file.</p>
      ${msg}
      <div class="reset-row"><button type="button" class="btn" id="bkCreate">Create backup file</button><button type="button" class="btn" id="bkOpen">Restore from a file</button></div>
    </div>`;
}

let popId = null;
function renderArea(a, col) {
  const items = a.list.filter(s => {
    if (ui.hideGot && got.has(s[0])) return false;
    if (ui.hideLocked && !got.has(s[0]) && !canGet(s[0])) return false;
    if (ui.age === "child" && s[1] === "A") return false;
    if (ui.age === "adult" && s[1] === "C") return false;
    return true;
  });
  const c = areaCount(a), t = a.list.length, l = left(a.list), locked = t - c - l;
  const seg = ["all", "child", "adult"].map(k => `<button type="button" data-age="${k}" aria-pressed="${ui.age === k}">${k === "all" ? "All" : k[0].toUpperCase() + k.slice(1)}</button>`).join("");
  const list = items.length ? items.map(s => {
    const [id, age, time, needs, hint, where, how] = s;
    const isGot = got.has(id), isOpen = ui.open === id;
    const miss = missing(id), isLocked = !isGot && miss.length > 0;
    const reqs = bestPath(id);
    return `<article class="item panel${isGot ? " got" : ""}${isLocked ? " locked" : ""}${isOpen ? " is-open" : ""}">
      <div class="item-head">
        <button type="button" class="open" data-open="${id}" aria-expanded="${isOpen}" aria-controls="d-${id}">
          <span class="hint">${esc(hint)}</span>
          <span class="chips">${ageChip(age)}${nightChip(time)}<span class="more">${isOpen ? "Less" : "Details"}${ICON_CHEV}</span></span>
          ${isLocked ? `<span class="needs-line">${ICON_LOCK}Needs ${esc(miss.map(groupName).join(", "))}</span>` : ""}
        </button>
        <button type="button" class="check${popId === id ? " pop" : ""}" data-check="${id}" aria-pressed="${isGot}" aria-label="${isGot ? "Mark as not found" : "Mark as found"}: ${esc(hint)}">
          <svg class="tok" viewBox="${col.key === "hp" ? "0 0 24 24" : "0 0 32 32"}" aria-hidden="true"><use href="#${col.icon}"/></svg>
          <span>${isGot ? "Got it" : "Found?"}</span>
        </button>
      </div>
      <div class="detail" id="d-${id}"${isOpen ? "" : " hidden"}>
        ${media(id)}
        <div><h3>Where</h3><p>${esc(where)}</p></div>
        <div><h3>How to get it</h3><p>${esc(how)}</p></div>
        ${reqs.length ? `<div><h3>You need</h3><div class="needs">${reqs.map(g => {
          const ok = g.some(has);
          if (g.length === 1 && g[0] === "tokens50") return `<span class="need${ok ? " have" : ""}">${ok ? "" : ICON_LOCK}50 Skulltula tokens</span>`;
          return `<button type="button" class="need${ok ? " have" : ""}" data-item="${g.find(has) || g[0]}" aria-pressed="${ok}" title="${ok ? "You have this" : "Tap if you have it"}">${ok ? "" : ICON_LOCK}${esc(groupName(g))}</button>`;
        }).join("")}</div><p class="need-tip">Tap an item to mark it as owned.</p></div>` : ""}
      </div>
    </article>`;
  }).join("") : `<p class="empty panel">${ui.hideGot || ui.hideLocked ? "Nothing left here that matches these filters." : "Nothing matches this filter."}</p>`;
  return `<div class="area-hero panel${c === t ? " done" : ""}">
      ${medal(a, 56)}
      <p><b>${c} of ${t} found</b>${c === t ? "This area is complete." : `${l} reachable now${locked ? `, ${locked} need items` : ""}.`}</p>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Filter by age">${seg}</div>
      <div class="toggles">
        <button type="button" class="toggle" id="hideGot" aria-pressed="${ui.hideGot}"><span class="sw"></span>Hide found</button>
        <button type="button" class="toggle" id="hideLocked" aria-pressed="${ui.hideLocked}"><span class="sw"></span>Hide locked</button>
      </div>
    </div>
    <div class="list">${list}</div>`;
}

function renderItems() {
  const open = ALL_ROWS.filter(s => !got.has(s[0]));
  const openSk = open.filter(s => COLS.sk.ids.has(s[0])), openHp = open.filter(s => COLS.hp.ids.has(s[0]));
  const nowSk = left(COLS.sk.rows), nowHp = left(COLS.hp.rows);
  const unlocks = id => open.filter(s => PATHS[s[0]].flat().some(g => g.includes(id) || (id === "longshot" && g.includes("hookshot")))).length;
  const groups = ["Gear", "Songs", "Quest"].map(g => `<section class="section">
      <h2 class="orn"><span class="gem"></span>${g === "Gear" ? "Equipment" : g === "Songs" ? "Songs" : "Quest items"}<span class="gem"></span></h2>
      <div class="slots">${ITEMS.filter(i => i.group === g).map(i => {
        const on = owned.has(i.id) || (i.id === "hookshot" && owned.has("longshot"));
        const implied = !owned.has(i.id) && on;
        const u = unlocks(i.id);
        return `<button type="button" class="slot${on ? " on" : ""}" data-item="${i.id}" aria-pressed="${on}" ${implied ? "disabled" : ""} style="${i.color ? `--note:${i.color}` : ""}">
          <span class="slot-art">${G(i.glyph)}</span>
          <span class="slot-name">${esc(i.name)}</span>
          <span class="slot-note">${implied ? "From Longshot" : u ? `Used for ${u}` : esc(i.note || "Not needed now")}</span>
        </button>`;
      }).join("")}</div>
    </section>`).join("");
  return `<div class="note-panel panel">
      <h3>Your inventory</h3>
      <p class="note">Tap what you've collected. Skulltulas and Heart Pieces that need something you don't have are greyed out, and the counters only count the ones you can reach.</p>
    </div>
    <p class="items-sum">Reachable now: <b>${nowSk}</b> Skulltula${nowSk === 1 ? "" : "s"} and <b>${nowHp}</b> Heart Piece${nowHp === 1 ? "" : "s"} · <b>${openSk.length - nowSk + openHp.length - nowHp}</b> need more items</p>
    ${groups}`;
}

let resetArmed = false;
function renderRewards() {
  const total = skCount();
  // Fill the path line up to the last reached milestone.
  const reachedIdx = REWARDS.reduce((i, r, k) => total >= r.n ? k : i, -1);
  const steps = REWARDS.map(r => {
    const reached = total >= r.n, isClaimed = claimed.has(r.n);
    const cls = isClaimed ? "claimed" : reached ? "ready" : "locked";
    const st = isClaimed ? "Collected" : reached ? "Ready to collect" : `${r.n - total} more token${r.n - total === 1 ? "" : "s"}`;
    return `<li class="step ${cls}">
      <span class="node"><b>${r.n}</b><small>tokens</small></span>
      <div class="panel">
        <span class="r-info"><span class="r-name">${esc(r.name)}</span><span class="r-desc">${esc(r.desc)}</span><span class="r-state">${st}</span></span>
        ${reached || isClaimed ? `<button type="button" class="btn" data-claim="${r.n}" aria-pressed="${isClaimed}">${isClaimed ? "Undo" : "Collected"}</button>` : ""}
      </div>
    </li>`;
  }).join("");
  return `<section class="section">
      <h2 class="orn"><span class="gem"></span>House of Skulltula<span class="gem"></span></h2>
      <ul class="path" id="path" data-reached="${reachedIdx}">${steps}</ul>
    </section>
    <div class="note-panel panel">
      <h3>Collecting</h3>
      <p class="note">The cursed family lives in the House of Skulltula in Kakariko Village. Talk to them once you reach each count, then mark the reward here.</p>
    </div>
    <div class="note-panel panel">
      <h3>Tip</h3>
      <p class="note">Night-only Skulltulas leave a faint gold web on their spot during the day, so you can find them early and come back after dark.</p>
    </div>
    <section class="section">
      <h2 class="orn"><span class="gem"></span>Progress<span class="gem"></span></h2>
      <div class="reset-row">
        <button type="button" class="btn danger" id="reset">${resetArmed ? "Tap again to clear everything" : "Clear all progress"}</button>
        ${resetArmed ? '<button type="button" class="btn" id="resetCancel">Keep my progress</button>' : ""}
      </div>
      ${backupCard(true)}
      <p class="sync" id="sync" style="text-align:left">${esc(backupLabel())}</p>
    </section>`;
}

// Draw the gold line along the rewards path from the first node to the last one reached.
function layoutPath() {
  const path = $("path"); if (!path) return;
  const idx = +path.dataset.reached;
  path.querySelector(".fill")?.remove();
  if (idx < 0) return;
  const nodes = path.querySelectorAll(".node");
  const top = nodes[0].offsetTop + nodes[0].offsetHeight / 2;
  const end = nodes[idx].offsetTop + nodes[idx].offsetHeight / 2;
  const fill = document.createElement("span");
  fill.className = "fill"; fill.style.top = top + "px"; fill.style.height = Math.max(0, end - top) + "px";
  path.prepend(fill);
}

function renderSync() { const el = $("sync"); if (el) el.textContent = backupLabel(); }

function currentRoute() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "rewards") return { name: "rewards", col: COLS.sk };
  if (h === "items") return { name: "items", col: COLS.sk };
  const col = h === "hearts" || h.startsWith("hearts/") ? COLS.hp : COLS.sk;
  const area = col.areas.find(a => col.base + a.id === h);
  if (area) return { name: "area", area, col };
  return { name: "home", col };
}

let lastRouteKey = "";
// Remember how far down each list page was, so going back from an area lands where you left off.
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
let scrollPos = {};
try { scrollPos = JSON.parse(sessionStorage.getItem(LS_KEY + "-scroll") || "{}") || {}; } catch (e) {}
function rememberScroll() {
  if (!lastRouteKey) return;
  scrollPos[lastRouteKey] = Math.round(window.scrollY);
  try { sessionStorage.setItem(LS_KEY + "-scroll", JSON.stringify(scrollPos)); } catch (e) {}
}
function render() {
  const route = currentRoute();
  const key = route.col.key + (route.area ? route.area.id : route.name);
  renderHeader(route);
  $("view").innerHTML = route.name === "rewards" ? renderRewards() : route.name === "items" ? renderItems() : route.area ? renderArea(route.area, route.col) : renderHome(route.col);
  if (route.name === "rewards") layoutPath();
  if (key !== lastRouteKey) { window.scrollTo(0, route.area ? 0 : scrollPos[key] || 0); lastRouteKey = key; resetArmed = false; }
  popId = null;
}
window.addEventListener("resize", layoutPath);
window.addEventListener("pagehide", rememberScroll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutPath);

// ---------- Events ----------
$("view").addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.check) {
    const id = t.dataset.check;
    if (got.has(id)) got.delete(id); else { got.add(id); popId = id; }
    save(); render();
    const again = document.querySelector(`[data-check="${id}"]`); if (again) again.focus();
  } else if (t.dataset.open) {
    ui.open = ui.open === t.dataset.open ? null : t.dataset.open;
    render();
    const again = document.querySelector(`[data-open="${t.dataset.open}"]`); if (again) again.focus();
  } else if (t.dataset.zoom) {
    const box = $("lightbox"), isMap = t.dataset.kind === "map", m = SK_MAP[t.dataset.zoom];
    const img = box.querySelector("img"), pin = box.querySelector(".pin");
    img.src = isMap ? m.src : SK_IMG[t.dataset.zoom];
    img.alt = isMap ? "Map of this area with the spot marked" : "Screenshot of this spot";
    pin.hidden = !isMap; if (isMap) pin.style.cssText = pinStyle(m);
    box.setAttribute("aria-label", isMap ? "Close map" : "Close screenshot");
    box.hidden = false; box.focus();
  } else if (t.dataset.view) {
    ui.view = t.dataset.view; persistUi(); render();
    const again = document.querySelector(`#d-${ui.open} [data-view="${ui.view}"]`); if (again) again.focus();
  } else if (t.dataset.age) {
    ui.age = t.dataset.age; persistUi(); render();
  } else if (t.dataset.item) {
    const id = t.dataset.item;
    owned.has(id) ? owned.delete(id) : owned.add(id);
    save(); render();
    const again = document.querySelector(`[data-item="${id}"]`); if (again) again.focus();
  } else if (t.id === "hideLocked") {
    ui.hideLocked = !ui.hideLocked; persistUi(); render();
  } else if (t.id === "hideGot") {
    ui.hideGot = !ui.hideGot; persistUi(); render();
  } else if (t.dataset.claim) {
    const n = +t.dataset.claim;
    claimed.has(n) ? claimed.delete(n) : claimed.add(n);
    save(); render();
  } else if (t.id === "reset") {
    if (!resetArmed) { resetArmed = true; render(); return; }
    got.clear(); claimed.clear(); owned.clear(); resetArmed = false; save(); render();
  } else if (t.id === "bkCreate") {
    NATIVE.create();
  } else if (t.id === "bkOpen") {
    NATIVE.open();
  } else if (t.id === "resetCancel") {
    resetArmed = false; render();
  }
});
window.addEventListener("hashchange", () => { rememberScroll(); ui.open = null; $("lightbox").hidden = true; render(); });
$("lightbox").addEventListener("click", () => { $("lightbox").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("lightbox").hidden = true; });

render();
initSync();
</script>
</body></html>
